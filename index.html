<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Utama</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #ffe4e6; /* Warna pink pastel lembut */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #1e3a8a;
            font-size: 22px;
            margin-bottom: 8px;
        }
        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn-timer {
            background-color: #3b82f6;
            color: white;
        }
        .btn-timer:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
        }
        .btn-lapor {
            background-color: #ef4444;
            color: white;
        }
        .btn-lapor:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Pilih Layanan</h1>
        <p>Silakan pilih menu yang ingin kamu akses:</p>
        
        <div class="btn-container">
            <!-- Ubah 'timer.html' sesuai nama file HTML Recovery Timer kamu -->
            <a href="timer.html" class="btn btn-timer">⏱️ Recovery Timer</a>
            
            <a href="laporan.html" class="btn btn-lapor">🚨 Laporkan Fasilitas</a>
        </div>
    </div>

</body>
</html>
