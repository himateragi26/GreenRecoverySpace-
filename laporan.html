<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Fasilitas & Tanaman</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #ffe4e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
        }
        h2 {
            color: #1e3a8a;
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #ef4444;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .btn-kirim {
            width: 100%;
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-kirim:hover {
            background-color: #dc2626;
        }
        .btn-kembali {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
        }
        .btn-kembali:hover {
            text-decoration: underline;
        }
        /* Pesan Sukses */
        .pesan-sukses {
            display: none;
            background-color: #dcfce7;
            color: #166534;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            margin-top: 15px;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Laporkan Fasilitas / Tanaman</h2>
        
        <form id="formLaporan">
            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" placeholder="Masukkan nama kamu" required>
            </div>

            <div class="form-group">
                <label for="angkatan">Angkatan</label>
                <input type="text" id="angkatan" placeholder="Contoh: 2024" required>
            </div>

            <div class="form-group">
                <label for="jurusan">Jurusan</label>
                <input type="text" id="jurusan" placeholder="Contoh: Terapi Gigi" required>
            </div>

            <div class="form-group">
                <label for="laporan">Isi Laporan</label>
                <textarea id="laporan" placeholder="Tuliskan kerusakan fasilitas atau tanaman di sini..." required></textarea>
            </div>

            <button type="submit" class="btn-kirim">KIRIM</button>
        </form>

        <!-- Tempat Teks Notifikasi Muncul -->
        <div id="pesanSukses" class="pesan-sukses">
            LAPORAN ANDA SUDAH MASUK
        </div>

        <a href="index.html" class="btn-kembali">← Kembali ke Menu Utama</a>
    </div>

    <script>
        document.getElementById('formLaporan').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah halaman refresh
            
            // Sembunyikan form dan tampilkan pesan sukses
            document.getElementById('formLaporan').style.display = 'none';
            document.getElementById('pesanSukses').style.display = 'block';
        });
    </script>

</body>
</html>
